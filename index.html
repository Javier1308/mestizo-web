    <!--
      DIRECTION CONTRACT — "La Mesa Mestiza"  (impeccable new-work · seed 41d401e2 · index 3 · mode persuade)

      THESIS: The site IS a set criollo table, not a photo-with-overlay hero. It owns the
      idea that "mestizo" = the mix made visible: a refined table (evening green linen,
      copper, quiet wide caps) that breaks into Peruvian chicha-poster energy (fluorescent
      lime / fucsia / orange, shouting condensed display) exactly at the social beats. It
      refuses the restaurant default of facade-photo + dark overlay + centered logo + "Ver Carta".

      OWN-WORLD: Ground = deep forest table green (#2f3f39) alternating with warm stone-linen
      (#f2ecdd). Ink = near-black green. Accents = lime (action), copper (refined detail),
      fucsia+orange (chicha, reserved for Promos/Barra/After Office). Type = Big Shoulders
      Display (poster shout) + Archivo (workhorse). Chicha lettering = layered offset shadows,
      radiating rays. No serif-on-cream cluster, no decorative Peruvian motifs as wallpaper.

      STORY: A first-timer understands in seconds "this is real Peruvian criollo food AND a
      social bar", feels invited (familiar, warm, not formal), and reaches for Reservar
      (WhatsApp) or shares the link. Every CTA funnels to WhatsApp.

      FIRST VIEWPORT: Full-bleed overhead set-table photo under a forest wash; the official
      negative logo, kicker "Restobar · Cocina Criolla · San Isidro", one-line promise,
      primary lime "Reservar" + secondary "Ver la Carta"; a thin ticker of the night's proof
      (Buffet, Barra Libre, After Office). Primary action sits above the fold.

      FORM: Set-table world fused with the chicha-poster graphic voice for the loud sections;
      single long social scroll, tabs and a carousel preserved from product truth. Seed 41d401e2.
    -->
